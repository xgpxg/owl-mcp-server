[package]
name = "http-api-call"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.44.1"
rocket = { version = "0.5.1", features = ["serde_json", "json"] }
anyhow = "1.0.97"
thiserror = "2.0"
log = "0.4.27"
env_logger = "0.11.7"
ansi_term = "0.12.1"
chrono = "0.4.39"
dashmap = { version = "6.1.0", features = ["serde"] }
rmcp = { version = "0.1.5", features = ["server", "transport-sse-server", "transport-io"] }
